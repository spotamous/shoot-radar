name: Shoot Radar alerts

on:
  schedule:
    # Morning digest 6:45am Melbourne (first = daylight saving, second = standard time)
    - cron: '45 19 * * *'
    - cron: '45 20 * * *'
    # Evening digest 6:45pm Melbourne
    - cron: '45 7 * * *'
    - cron: '45 8 * * *'
    # Live lightning + aurora watch every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        options: [digest, live]
        default: digest

permissions:
  contents: write

concurrency:
  # live checks and digests queue separately so a live run never bumps a digest
  group: shoot-radar-${{ (github.event.schedule == '*/15 * * * *' || inputs.mode == 'live') && 'live' || 'digest' }}
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Check conditions and notify
        run: node alert.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
      - name: Save state and history
        run: |
          git config user.name "shoot-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update alert state [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          echo "Could not push state after 3 tries"; exit 1
